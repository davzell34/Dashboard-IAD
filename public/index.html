<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=https://entradrc.secib.eu/">
<meta name="robots" content="noindex">
<title>Redirection vers EntraDRC</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b2545;
    color: #f0f1f4;
    font-family: -apple-system, "Segoe UI", Inter, sans-serif;
    text-align: center;
  }
  .box { padding: 24px; }
  a { color: #eaf2ff; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: #eaf2ff;
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<script>
  // Redirection JS en filet de sécurité, au cas où le meta refresh
  // serait bloqué par le navigateur/une extension.
  window.location.replace("https://entradrc.secib.eu/");
</script>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <p>Redirection vers EntraDRC…</p>
    <p><a href="https://entradrc.secib.eu/">Cliquez ici si la redirection ne se lance pas automatiquement</a></p>
  </div>
</body>
</html>
